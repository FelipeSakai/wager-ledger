name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare PostgreSQL, LocalStack, schema and queues
        run: bun run setup
      - name: Check formatting and architectural boundaries
        run: bun run format:check && bun run typecheck
      - name: Compile
        run: bun run build
      - name: Unit, integration and independent process tests
        run: bun test --timeout 30000
      - name: Dependency logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 postgres localstack
      - name: Stop dependencies
        if: always()
        run: docker compose stop
